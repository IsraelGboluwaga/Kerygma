services:
  kerygma:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-medium.en}
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/sermons.db
      - XENOVA_CACHE=/data/models
      - WHISPER_MODEL=${WHISPER_MODEL:-medium.en}
    volumes:
      - ./data:/data
    restart: unless-stopped
