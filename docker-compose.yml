services:
  kerygma:
    build:
      context: .
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/sermons.db
      - XENOVA_CACHE=/app/data/models
    volumes:
      - ./data:/app/data
    restart: unless-stopped
