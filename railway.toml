[build]
builder = "DOCKERFILE"
watchPatterns = ["src/**", "frontend/**", "scripts/**", "public/**", "Dockerfile", "docker-entrypoint.sh", "litestream.yml", "package.json", "yarn.lock", "tsconfig.json", "railway.toml", "railway.json"]

[deploy]
startCommand = "./docker-entrypoint.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
