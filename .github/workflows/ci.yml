name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    name: App Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        # Retry to ride out transient network flakes when native deps (e.g. sharp)
        # download prebuilt binaries from GitHub Releases during postinstall.
        run: |
          for attempt in 1 2 3; do
            echo "::group::yarn install (attempt $attempt)"
            if yarn install --frozen-lockfile; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "yarn install failed on attempt $attempt"
            sleep $((attempt * 15))
          done
          echo "yarn install failed after 3 attempts" >&2
          exit 1

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

